modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Alexander-288/burnt-fighters/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "Static (alexander-288)"
    credits = "Pixelbank, for Burnt Basic. Mikoalopex, for Create: FireFighting Additions."
    displayURL = "https://github.com/Alexander-288/burnt-fighters"
    logoFile = "logo.png"
    # Server-side logic only: no rendering, no packets, no client state. Clients
    # without this mod can join a server that has it.
    displayTest = "IGNORE_ALL_VERSION"
    # Burnt is pixel art; without this NeoForge smooths the mod-list logo.
    logoBlur = false
    description = '''
Bridges Burnt Basic's fire into Create's fluid machinery, so a spout full of
water puts out a Burnt fire the same way Burnt itself would.
'''

# --- Required ---------------------------------------------------------------

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"

# Burnt is required, not optional: every code path here delegates to Burnt's
# extinguish procedures, so without it the mod does nothing at all. A hard
# dependency gives a clear loader error instead of a silent no-op.
[[dependencies.${mod_id}]]
    modId = "burnt"
    type = "required"
    versionRange = "[1.10,)"
    ordering = "AFTER"
    side = "BOTH"

# --- Optional ---------------------------------------------------------------
# One integration each. Ordered AFTER so their registries exist before we
# touch them; absent, the matching compat class is never loaded.

[[dependencies.${mod_id}]]
    modId = "create"
    type = "optional"
    versionRange = "[6.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "createfirefightingadd"
    type = "optional"
    versionRange = "[0.2.1-beta,)"
    ordering = "AFTER"
    side = "BOTH"
