modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Alexander-288/burnt-fighters/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "Static (alexander-288)"
    credits = "Pixelbank, for Burnt Basic. Mikoalopex, for Create: FireFighting Additions."
    displayURL = "https://github.com/Alexander-288/burnt-fighters"
    description = '''
Bridges Burnt Basic's fire into Create's fluid machinery, so a spout full of
water puts out a Burnt fire the same way Burnt itself would.
'''

# --- Required ---------------------------------------------------------------

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"

# --- Optional ---------------------------------------------------------------
# Nothing here is required: with none of these present this mod is inert. All
# are ordered AFTER so their registries and tags exist before we touch them.

[[dependencies.${mod_id}]]
    modId = "burnt"
    type = "optional"
    versionRange = "[1.10,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "create"
    type = "optional"
    versionRange = "[6.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "createfirefightingadd"
    type = "optional"
    versionRange = "[0.2.1-beta,)"
    ordering = "AFTER"
    side = "BOTH"
